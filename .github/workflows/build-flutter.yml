name: Build Flutter APK
run-name: build-${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL zip project (GitHub Release asset)"
        required: true
      tag:
        description: "Tag unik untuk build ini"
        required: true
      build_type:
        description: "release atau debug"
        required: true
        default: "release"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Download project ZIP
        run: |
          curl -L "${{ inputs.zip_url }}" -o project.zip
          mkdir -p project
          unzip -q project.zip -d project

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Flutter pub get
        working-directory: project
        run: flutter pub get

      - name: Build APK (release)
        if: ${{ inputs.build_type == 'release' }}
        working-directory: project
        run: flutter build apk --release

      - name: Build APK (debug)
        if: ${{ inputs.build_type == 'debug' }}
        working-directory: project
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.tag }}
          path: project/build/app/outputs/flutter-apk/*.apk
          retention-days: 1
          
